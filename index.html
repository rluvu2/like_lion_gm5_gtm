<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUXE SKIN | 하이엔드 스킨케어</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #1a1a1a; --accent: #c5a059; --bg: #fdfdfd; }
        body { margin: 0; font-family: 'Noto Sans KR', sans-serif; background: var(--bg); color: var(--primary); }
        nav { display: flex; justify-content: space-between; align-items: center; padding: 20px 50px; background: #fff; border-bottom: 1px solid #eee; position: sticky; top: 0; z-index: 100; }
        .logo { font-family: 'Playfair Display', serif; font-size: 24px; font-weight: 700; letter-spacing: 2px; }
        .nav-links a { margin-left: 30px; text-decoration: none; color: var(--primary); font-weight: 500; font-size: 14px; }
        .hero { height: 80vh; display: flex; align-items: center; justify-content: center; text-align: center; background: linear-gradient(rgba(0,0,0,0.2), rgba(0,0,0,0.2)), url('https://images.unsplash.com/photo-1556228578-0d85b1a4d571?auto=format&fit=crop&w=1920&q=80') center/cover; color: #fff; }
        .hero-content h2 { font-family: 'Playfair Display', serif; font-size: 64px; margin-bottom: 20px; }
        .btn { display: inline-block; padding: 15px 40px; background: var(--primary); color: #fff; text-decoration: none; font-weight: bold; transition: 0.3s; border: 1px solid var(--primary); cursor: pointer; }
        .btn:hover { background: #fff; color: var(--primary); }
    </style>
</head>
<body>
    <nav>
        <div class="logo">LUXE SKIN</div>
        <div class="nav-links">
            <a href="index.html">HOME</a>
            <a href="signup.html">MEMBERSHIP</a>
            <a href="product.html">SHOP</a>
        </div>
    </nav>

    <section class="hero">
        <div class="hero-content">
            <h2>Timeless Beauty</h2>
            <p>본연의 아름다움을 깨우는 럭셔리 스킨케어 솔루션</p>
            <a href="product.html" class="btn">EXPERIENCE NOW</a>
        </div>
    </section>

    <footer style="padding: 50px; text-align: center; font-size: 12px; color: #999; border-top: 1px solid #eee;">&copy; 2024 LUXE SKIN. All Rights Reserved.</footer>
</body>
</html>
